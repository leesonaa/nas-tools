name: NAStool Docker
on:
  workflow_dispatch:

jobs:
  alpine:
    runs-on: ubuntu-latest
    name: Build Docker Image (Alpine)
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=${app_version}" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=latest

      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  debian-amd64:
    runs-on: ubuntu-latest
    name: Build Docker Image (Debian amd64)
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=${app_version}-debian" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=debian

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Build amd64 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/debian.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/nas-tools,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=debian-amd64
          cache-to: type=gha,mode=max,scope=debian-amd64

      -
        name: Export amd64 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      -
        name: Upload amd64 digest
        uses: actions/upload-artifact@v4
        with:
          name: debian-digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error

  debian-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build Docker Image (Debian arm64)
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=${app_version}-debian" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=debian

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Build arm64 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/debian.Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/nas-tools,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=debian-arm64
          cache-to: type=gha,mode=max,scope=debian-arm64

      -
        name: Export arm64 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      -
        name: Upload arm64 digest
        uses: actions/upload-artifact@v4
        with:
          name: debian-digest-arm64
          path: /tmp/digests/*
          if-no-files-found: error

  debian-manifest:
    needs: [debian-amd64, debian-arm64]
    runs-on: ubuntu-latest
    name: Publish Docker Image (Debian manifest)
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=${app_version}-debian" >> $GITHUB_ENV

      -
        name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: debian-digest-*
          path: /tmp/digests
          merge-multiple: true

      -
        name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nas-tools
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=debian

      -
        name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Publish multi-platform manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/nas-tools
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for digest in /tmp/digests/*; do
            images="${images} ${IMAGE}@sha256:$(basename "${digest}")"
          done
          for tag in ${TAGS}; do
            docker buildx imagetools create --tag "${tag}" ${images}
          done